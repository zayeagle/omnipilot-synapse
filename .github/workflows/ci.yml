name: CI

# `docs/omnidev-state/**` is workflow bookkeeping: it is not a build input and no test reads it.
# The design-docs contract test reads docs/product/**, docs/audits/**, AGENTS.md and README.md, and
# those are deliberately NOT ignored — changing them is supposed to fail the build. Ignoring only the
# state files keeps a bookkeeping-only commit from spending a full run, browser suite included.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/omnidev-state/**'
  pull_request:
    paths-ignore:
      - 'docs/omnidev-state/**'
  # Always available by hand, so an ignored-path change can still be verified on purpose.
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/extension

jobs:
  verify:
    name: extension - types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:int

      - name: Build (Chrome MV3)
        run: npm run build

      - name: Assert content bundle carries no secrets
        run: npm run assert:content

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: apps/extension/.output
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: extension - end to end
    runs-on: ubuntu-latest
    # Its own job so a red unit test does not spend the browser budget, and so the two can be re-run
    # independently. This is the only layer that catches a wiring bug in the worker, the popup or the
    # options page — it has paid for itself every time it was run.
    needs: verify
    # NOT part of the automatic gate any more. Run it locally (`npm run test:e2e`) or from the Actions tab
    # via `workflow_dispatch` when a change touches the worker, the popup or the options page — those are
    # the wiring bugs it exists to catch. The specs are untouched and still hold the E2E baseline.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Build the extension under test
        # The suite loads `.output/chrome-mv3`, so a separate job has to produce it: `test:e2e` alone
        # would run against whatever the checkout happens to contain (nothing).
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Extension E2E needs a headed browser, so Linux runs it under a virtual display.
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/extension/test-results
          if-no-files-found: ignore
          retention-days: 7

  git-bridge:
    name: companion - types, tests, system
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The workflow default is the extension; this job builds the companion instead.
    defaults:
      run:
        working-directory: apps/git-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/git-bridge/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: System tests
        # The SYS suite skips itself when git/ssh is unavailable; it never fails silently.
        run: npm run test:sys

      - name: Build + bundle the companion
        run: npm run pack -- --skip-test

      - name: Upload companion bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-bundle
          path: apps/git-bridge/.output
          if-no-files-found: ignore
          retention-days: 7
